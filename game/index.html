<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turkey Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #140c06; }
  body { display: grid; place-items: center; }
  /* 1280x800 (16:10) scaled to fit the window, never stretched. */
  #game {
    display: block;
    width: min(100vw, 160vh);
    height: auto;
    aspect-ratio: 16 / 10;
    background: #f6c98a;
    touch-action: none;
    cursor: pointer;
    outline: none;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<h1 class="sr-only">Turkey Run</h1>
<p class="sr-only">Out of the farmyard, through the barn and past the kitchen to the treeline.
  Space, Up or W jumps; Down or S slides under gates and beams; a click or tap jumps.
  P or Escape pauses, M mutes, R starts again.</p>
<canvas id="game" width="1280" height="800" tabindex="0"
  aria-label="Turkey Run. A turkey runs from a farmer through three stages."></canvas>
<p id="announce" class="sr-only" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
